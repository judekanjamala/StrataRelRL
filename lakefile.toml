name = "StrataRelRL"
version = "0.1.0"
defaultTargets = ["RelRL"]

[leanOptions]
warningAsError = true

[[require]]
name = "Strata"
git = "https://github.com/strata-org/Strata.git"
rev = "main"

[[lean_lib]]
name = "RelRL"
globs = ["RelRL", "RelRL.DDMTransform.+", "RelRL.Verify", "RelRL.Cli"]

[[lean_lib]]
name = "RelRLExamples"
globs = ["RelRL.Examples.+"]

# Standalone `relrl` executable, self-contained within this package: no
# dependency on the separate Strata-CLI repo. `relrl verify <file>` and
# `relrl toCore <file>` reuse `Strata.Cli.Framework` (from the `Strata`
# dependency above) directly.
[[lean_exe]]
name = "relrl"
root = "Main"

# Grammar/translation tests. Built by `lake build RelRLTest`; `#guard_msgs`
# failures are Lean errors, so a regression fails the build.
[[lean_lib]]
name = "RelRLTest"
globs = ["RelRLTest.+"]
