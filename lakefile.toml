name = "StrataRelRL"
version = "0.1.0"
defaultTargets = ["RelRL"]

[leanOptions]
warningAsError = true

# RelRL is a relational dialect over Strata Core, ported from the RelRL
# project. Per the Strata repository-split philosophy (see
# docs/verso/IRTranslationPhilosophyDoc.lean, "Relation to the proposed
# repository split", issue #1168), a dialect + translation-to-Core such as
# this one lives in its own package and depends on the main `Strata`
# package; `Strata` does not depend on it.
[[require]]
name = "Strata"
path = "../Strata"

[[lean_lib]]
name = "RelRL"
globs = ["RelRL", "RelRL.DDMTransform.+", "RelRL.Verify", "RelRL.Cli"]

[[lean_lib]]
name = "RelRLExamples"
globs = ["RelRL.Examples.+"]

# Standalone `relrl` executable, self-contained within this package: no
# dependency on the separate Strata-CLI repo. `relrl relrlVerify <file>` and
# `relrl relrlToCore <file>` reuse `Strata.Cli.Framework` (from the `Strata`
# dependency above) directly.
[[lean_exe]]
name = "relrl"
root = "Main"
